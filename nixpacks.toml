# Railway Web Service Configuration (Next.js)
# For Agent service, use nixpacks-agent.toml

[phases.setup]
# Prisma 7.2.0 requires Node.js 20.19+ or 22.12+
# Let nixpacks auto-detect Node.js version from NIXPACKS_NODE_VERSION env var
nixPkgs = ["openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
